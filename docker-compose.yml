services:
  db:
    image: postgres:16
    container_name: defects_postgres
    restart: always
    environment:
      POSTGRES_DB: defects_auto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sliterak1
    ports:
      - "5432:5432"
    volumes:
      - /database/data:/var/lib/postgresql/data

  web:
    build: .
    container_name: defects_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "80:8000"
    environment:
      POSTGRES_DB: defects_auto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sliterak1
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - /database/media:/app/media
    depends_on:
      - db
