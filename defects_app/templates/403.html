<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нет доступа</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f5f3f8; margin:0; }
        .box {
            max-width: 720px; margin: 80px auto; background:#fff;
            border-left:8px solid #b9a7cc; border-radius:12px; padding:24px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }
        h1 { margin-top:0; font-size:30px; }
        p { font-size:17px; color:#333; }
        .btn {
            display:inline-block; margin-top:14px; padding:10px 16px; border-radius:8px;
            text-decoration:none; background:#b9a7cc; color:#000;
        }
        .btn:hover { background:#a48fbc; }
    </style>
</head>
<body>
    <div class="box">
        <h1>У вас нет доступа</h1>
        <p>{{ access_denied_message|default:"Проверьте, что выбран правильный отдел и роль пользователя." }}</p>
        <a class="btn" href="/department-hub/">Вернуться к выбору отдела</a>
        <a class="btn" href="/accounts/login/">На страницу входа</a>
    </div>
</body>
</html>
