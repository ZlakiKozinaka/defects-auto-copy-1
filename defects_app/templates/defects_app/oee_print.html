<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <link rel="icon" type="image/webp" href="{% static 'icons/icon_defects.webp' %}">
    <meta charset="UTF-8">
    <title>Печать OEE отчёта</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @page {
            size: A3 landscape;
            margin: 10mm;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
            margin: 0;
            padding: 0;
        }

        .page {
            width: 100%;
            box-sizing: border-box;
        }

        .title {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            font-size: 18px;
            margin-bottom: 18px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .kpi-card {
            border: 1px solid #999;
            padding: 12px;
            border-radius: 8px;
        }

        .kpi-title {
            font-size: 13px;
            color: #555;
        }

        .kpi-value {
            font-size: 26px;
            font-weight: bold;
            margin-top: 8px;
        }

        .chart-block {
            border: 1px solid #999;
            border-radius: 8px;
            padding: 12px;
            height: 330px;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            border: 1px solid #999;
            padding: 5px;
            text-align: left;
        }

        th {
            background: #e9e1f1;
        }

        .no-print {
            text-align: center;
            margin: 15px;
        }

        .btn {
            background: #b9a7cc;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        @media print {
            .no-print {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="no-print">
        <button class="btn" onclick="window.print()">Печать</button>
        <button class="btn" onclick="window.close()">Закрыть</button>
    </div>

    <div class="page">
        <div class="title">OEE ОТЧЁТ</div>
        <div class="subtitle">Месяц: <span id="monthText">{{ selected_month }}</span></div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-title">OEE за месяц</div>
                <div class="kpi-value" id="monthOee">—</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-title">План</div>
                <div class="kpi-value" id="totalPlan">—</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-title">Факт</div>
                <div class="kpi-value" id="totalFact">—</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-title">Отклонение</div>
                <div class="kpi-value" id="difference">—</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-title">Простой, мин</div>
                <div class="kpi-value" id="totalDowntime">—</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-title">В.П.</div>
                <div class="kpi-value" id="downtimePercent">—</div>
            </div>
        </div>

        <div class="chart-block">
            <canvas id="oeeChart"></canvas>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Рабочие минуты</th>
                    <th>Целевой такт-тайм</th>
                    <th>Фактический такт-тайм</th>
                    <th>План</th>
                    <th>Факт</th>
                    <th>OEE</th>
                    <th>Простой, мин</th>
                    <th>В.П.</th>
                    <th>План задан</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const selectedMonth = "{{ selected_month }}";

        function setText(id, value) {
            document.getElementById(id).textContent = value;
        }

        function formatPercent(value) {
            return `${Number(value || 0).toFixed(2)}%`;
        }

        function loadPrintData() {
            fetch(`/reports/oee/api/?month=${selectedMonth}`)
                .then(response => response.json())
                .then(data => {
                    const summary = data.summary;

                    setText("monthOee", formatPercent(summary.month_oee));
                    setText("totalPlan", summary.total_plan);
                    setText("totalFact", summary.total_fact);
                    setText("difference", summary.difference);
                    setText("totalDowntime", summary.total_downtime);
                    setText("downtimePercent", formatPercent(summary.downtime_percent));

                    renderChart(data.days);
                    renderTable(data.days);
                });
        }

        function renderChart(days) {
            const ctx = document.getElementById("oeeChart");

            new Chart(ctx, {
                type: "bar",
                data: {
                    labels: days.map(item => item.date),
                    datasets: [{
                        label: "OEE, %",
                        data: days.map(item => item.oee || 0),
                        backgroundColor: "#5b87c2",
                        borderColor: "#4c77ad",
                        borderWidth: 1
                    }]
                },
                options: {
                    devicePixelRatio: 3,
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            suggestedMax: 120,
                            ticks: {
                                callback: function(value) {
                                    return value + "%";
                                }
                            }
                        },
                        x: {
                            ticks: {
                                maxRotation: 60,
                                minRotation: 60
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function renderTable(days) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            days.forEach(item => {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                    <td>${item.date}</td>
                    <td>${item.takt_minutes || ""}</td>
                    <td>${item.actual_takt_minutes || ""}</td>
                    <td>${item.plan}</td>
                    <td>${item.fact}</td>
                    <td>${formatPercent(item.oee)}</td>
                    <td>${item.downtime_minutes}</td>
                    <td>${formatPercent(item.downtime_percent)}</td>
                    <td>${item.has_plan ? "Да" : "Нет"}</td>
                `;

                tbody.appendChild(tr);
            });
        }

        loadPrintData();
    </script>
</body>
</html>
